# Fly.io config for the worker. `fly launch --no-deploy` will offer to rename
# the app; keep the [processes] and [http_service] sections as they are.
app = "watchlist-worker"
primary_region = "iad"   # put it near your Supabase region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "INFO"

# Same image, two kinds of machine. Scale them separately:
#   fly scale count web=1 scheduler=1
[processes]
  web = "uvicorn api:app --host 0.0.0.0 --port 8080"
  scheduler = "python -m scheduler"

# Only `web` takes traffic. The scheduler has no service, so Fly never
# auto-stops it.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "scheduler"]
